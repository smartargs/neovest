name: CI

on:
  push:
    branches: [main]
  pull_request:

# Allow only one CI run per ref at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract — Gradle test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run contract tests
        run: ./gradlew :contract:test
      - name: Compile NEF
        run: ./gradlew :contract:neow3jCompile

  ui:
    name: UI — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Unit tests
        working-directory: ui
        run: npm run test
      # The UI's `prebuild` script bundles the compiled NEF + checksum.
      # Compile the contract first so those scripts have something to copy.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compile contract for UI bundling
        run: ./gradlew :contract:neow3jCompile
      - name: Verify bundled NEF artifact matches the compiled contract
        run: |
          cd ui && npm run sync && cd ..
          git diff --exit-code -- ui/src/lib/nef-artifacts.ts ui/src/lib/nef-checksum.ts \
            || { echo "::error::Bundled NEF is stale — run 'cd ui && npm run sync' and commit the result."; exit 1; }
      - name: Type-check
        working-directory: ui
        run: npm run typecheck
      - name: Build
        working-directory: ui
        run: npm run build
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: ui
        # webServer in playwright.config.ts runs `vite preview` against the
        # dist/ built in the previous step.
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
      - name: Bundle-size budget
        working-directory: ui
        run: |
          set -euo pipefail
          # Fail the build if any individual JS chunk exceeds the budget.
          # Tune as needed; the budget is intentionally loose pre-1.0.
          MAX_BYTES=$((1500 * 1024))   # 1.5 MB uncompressed per chunk
          oversized=0
          for f in dist/assets/*.js; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "::error file=$f::Chunk exceeds budget: $size bytes (max $MAX_BYTES)"
              oversized=1
            fi
          done
          exit "$oversized"
